name: Offline safehouse contract
on:
  pull_request:
    paths:
      - 'src/Civ13/Safehouse/**'
      - 'tests/safehouse/**'
      - '.github/workflows/safehouse.yml'
  push:
    paths:
      - 'src/Civ13/Safehouse/**'
      - 'tests/safehouse/**'
      - '.github/workflows/safehouse.yml'
permissions:
  contents: read
jobs:
  safehouse:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3', '8.4']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php tests/safehouse/run.php
