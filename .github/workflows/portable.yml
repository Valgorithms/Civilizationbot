name: Portable startup contracts
on: [push, pull_request]
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        php: ['8.3', '8.4', '8.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, curl
          coverage: none
      - run: composer install --no-interaction --no-plugins --no-scripts --no-dev
      - run: php tests/windows/constructor.php
      - run: php tests/windows/constructor.php vendor/autoload.php --negative-control
      - run: php tests/windows/constructor.php vendor/autoload.php --cache-negative-control
      - run: php tests/windows/portable.php
      - run: php tests/local/adminlist-files.php vendor/autoload.php
      - run: php tests/local/access-list-sync.php
        timeout-minutes: 2
      - run: php tests/windows/default-branch.php
      - run: php tests/windows/lock-path-guard.php
      - run: php tests/windows/hosted-verifier.php
      - name: Synthetic authenticated mapping TLS
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: python3 tests/local/verification-tls-runner.py --repo . --evidence "$RUNNER_TEMP/civ13-mapping-tls"
      - name: Preserve bounded synthetic TLS receipts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-tls-${{ matrix.php }}-${{ github.event_name }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/civ13-mapping-tls/public-receipt.json
            ${{ runner.temp }}/civ13-mapping-tls/safe-reports/**/process.json
            ${{ runner.temp }}/civ13-mapping-tls/safe-reports/**/stdout.log.snapshot
            ${{ runner.temp }}/civ13-mapping-tls/safe-reports/**/stderr.log.snapshot
      - run: php tests/windows/native-lifecycle.php
      - run: php tests/windows/bootstrap.php
      - run: php tests/windows/bootstrap.php --negative-control
      - run: php tests/windows/process.php
      - name: Contained WebAPI errors (offline)
        timeout-minutes: 2
        run: php -d allow_url_fopen=0 -d disable_functions=fsockopen,pfsockopen,stream_socket_client,stream_socket_server,stream_socket_accept,curl_exec,curl_multi_exec,socket_create,exec,shell_exec,system,passthru,proc_open,popen tests/local/webapi-errors.php
      - name: Portable restart contracts (offline)
        timeout-minutes: 2
        run: php -d allow_url_fopen=0 -d disable_functions=fsockopen,pfsockopen,stream_socket_client,stream_socket_server,stream_socket_accept,curl_exec,curl_multi_exec,socket_create,exec,shell_exec,system,passthru,proc_open,popen tests/windows/portable-restart.php
      - run: php tests/windows/shell-guard.php
      - run: php tests/windows/ready.php
      - run: php tests/windows/ready.php vendor/autoload.php --hosted
      - run: php tests/windows/ready.php vendor/autoload.php --unconfigured
      - name: Windows file IPC and role-list contracts
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: php tests/local/server-compatibility.php vendor/autoload.php
      - name: Windows durable relay contracts
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: php tests/local/relay.php vendor/autoload.php
      - run: php -l bot.php
      - run: php -l src/Civ13/Civ13.php
      - run: php -l src/Civ13/GameServer.php
