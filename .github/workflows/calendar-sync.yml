name: Public calendar offline contracts
on:
  pull_request:
    paths: ['src/Civ13/Calendar/**', 'src/Civ13/Civ13.php', 'src/Civ13/HttpServiceManager.php', 'bot.php', 'config/calendar.example.php', 'tests/calendar/**', 'docs/community-calendar.md', 'composer.lock', '.github/workflows/calendar-sync.yml']
  push:
    branches: [main]
    paths: ['src/Civ13/Calendar/**', 'tests/calendar/**', '.github/workflows/calendar-sync.yml']
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3', '8.4', '8.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction
      - run: php tests/calendar/run.php
      - run: php -l src/Civ13/Civ13.php
      - run: php -l src/Civ13/HttpServiceManager.php
      - run: php -l bot.php
