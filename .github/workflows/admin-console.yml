name: Read-only admin console contracts

on:
  push:
    paths:
      - 'src/Civ13/AdminConsole/**'
      - 'tests/admin-console/**'
      - 'web/admin-console/**'
      - '.github/workflows/admin-console.yml'
  pull_request:
    paths:
      - 'src/Civ13/AdminConsole/**'
      - 'tests/admin-console/**'
      - 'web/admin-console/**'
      - '.github/workflows/admin-console.yml'

permissions:
  contents: read

jobs:
  projection:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3', '8.4', '8.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint display contract
        run: php -l src/Civ13/AdminConsole/AdminServerProjection.php
      - name: Lint offline test
        run: php -l tests/admin-console/projection.php
      - name: Lint cached observation adapter
        run: php -l src/Civ13/AdminConsole/CachedObservationAdapter.php
      - name: Lint cached observation tests
        run: php -l tests/admin-console/cached-observation.php
      - name: Cached observation contracts
        timeout-minutes: 2
        run: php tests/admin-console/cached-observation.php
      - name: Lint status service
        run: php -l src/Civ13/AdminConsole/ReadOnlyStatusService.php
      - name: Lint unregistered HTTP endpoint
        run: php -l src/Civ13/AdminConsole/StatusEndpoint.php
      - name: Lint status service tests
        run: php -l tests/admin-console/status-service.php
      - name: Lint HTTP boundary tests
        run: php -l tests/admin-console/status-http.php
      - name: Dependency-free status service contracts
        timeout-minutes: 2
        run: php tests/admin-console/status-service.php
      - name: Dependency-free projection contracts
        timeout-minutes: 2
        run: php tests/admin-console/projection.php

  ui-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/admin-console/console.js
      - run: node --check web/admin-console/fixtures.js
      - run: node --check web/admin-console/demo.js
      - name: Dependency-free DOM contracts (not browser/layout acceptance)
        run: node tests/admin-console/ui-dom.mjs

  http-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, curl
          coverage: none
      - name: Install existing application dependencies without scripts/plugins
        run: composer install --no-interaction --no-plugins --no-scripts --no-dev
      - name: Actual PSR and React HTTP boundary contracts (offline)
        timeout-minutes: 2
        run: php tests/admin-console/status-http.php
