name: Offline API documentation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'phpdoc.dist.xml'
      - 'scripts/docs/**'
      - 'docs/api-build.md'
      - '.github/workflows/docs-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: iconv, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify pinned phpDocumentor
        run: |
          curl --fail --location --output phpDocumentor.phar https://github.com/phpDocumentor/phpDocumentor/releases/download/v3.10.0/phpDocumentor.phar
          echo 'fe1e7c23ba3329aa6f19ac3c807446159a431a195ec5d9163b0c281a15105207  phpDocumentor.phar' | sha256sum --check

      - name: Build source reference without bot bootstrap
        run: php phpDocumentor.phar --config phpdoc.dist.xml --no-interaction

      - name: Check links, search and exact-head development provenance
        run: |
          node scripts/docs/finalize.mjs
          node scripts/docs/verify.mjs "${{ github.event.pull_request.head.sha }}"
