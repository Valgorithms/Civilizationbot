name: Local profile offline contracts
on:
  pull_request:
    paths:
      - 'composer.json'
      - 'composer.lock'
      - 'src/Civ13/Local/**'
      - 'src/Civ13/Server/**'
      - 'src/Civ13/RestartPolicy.php'
      - 'src/Civ13/Civ13.php'
      - 'src/Civ13/GameServer.php'
      - 'src/Civ13/AdminListRenderer.php'
      - 'src/Civ13/AdminSyncSnapshotGate.php'
      - 'src/Civ13/AdminSyncCoordinator.php'
      - 'src/Civ13/AdminMemberSnapshotProvider.php'
      - 'src/Civ13/AdminCacheSyncTrigger.php'
      - 'src/Civ13/AdminFileSync.php'
      - 'src/Civ13/AccessFileSync.php'
      - 'src/Civ13/AccessListProjection.php'
      - 'src/Civ13/PortableProfile.php'
      - 'src/Civ13/HostedVerificationSource.php'
      - 'src/Civ13/HostedVerificationSnapshot.php'
      - 'src/Civ13/Verifier.php'
      - 'src/Civ13/Slash.php'
      - 'src/Civ13/Panels.php'
      - 'src/Civ13/MessageCommand/Commands/AdminListUpdate.php'
      - 'src/Civ13/MessageCommand/Commands/Civ13GameServerMapSwap.php'
      - 'src/Civ13/HttpServiceManager.php'
      - 'local-bot.php'
      - 'bot.php'
      - 'tests/local/**'
      - 'scripts/local/**'
      - '.github/workflows/local-profile.yml'
  workflow_dispatch:
    inputs:
      native_smoke:
        description: 'Authorize pinned PHPacker build and nonconnecting EXE smoke on one isolated CI runner'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  replica:
    if: github.event_name != 'workflow_dispatch' || !inputs.native_smoke
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3', '8.4']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none
      - run: php tests/local/run.php
      - run: php tests/local/admin-sync-projection.php
      - run: php tests/local/admin-file-sync-profile.php
      - run: php tests/local/admin-file-writer.php
        timeout-minutes: 2
      - run: php -l local-bot.php
  supervision:
    if: github.event_name != 'workflow_dispatch' || !inputs.native_smoke
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php tests/local/library.php
      - run: php tests/local/admin-sync-coordinator.php vendor/autoload.php
      - run: php tests/local/admin-member-snapshot.php vendor/autoload.php
      - run: php tests/local/admin-cache-sync.php vendor/autoload.php
        timeout-minutes: 2
      - run: php tests/local/admin-file-sync.php vendor/autoload.php
        timeout-minutes: 2
      - run: php tests/local/access-list-sync.php vendor/autoload.php
        timeout-minutes: 2
      - run: php tests/local/access-file-sync.php vendor/autoload.php
        timeout-minutes: 2
      - run: php tests/local/admin-verification-refresh.php vendor/autoload.php
        timeout-minutes: 2
      - run: php tests/local/opendream.php
      - run: php tests/local/restart-command.php vendor/autoload.php
      - run: php tests/local/lifecycle.php vendor/autoload.php
      - run: php tests/local/controls.php
      - run: php tests/local/server-compatibility.php vendor/autoload.php
        timeout-minutes: 2
      - run: php tests/local/relay.php vendor/autoload.php
        timeout-minutes: 2
      - run: php tests/local/message-delivery.php vendor/autoload.php
      - run: php tests/local/ooc-webhook.php vendor/autoload.php
      - run: php tests/local/unban-commands.php vendor/autoload.php
      - run: php tests/local/adminlist-consumers.php vendor/autoload.php
      - run: php tests/local/lifecycle-consumers.php vendor/autoload.php
  admin-sync-windows:
    if: github.event_name != 'workflow_dispatch' || !inputs.native_smoke
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-plugins --no-scripts --no-dev --prefer-dist --no-progress
      - run: php -d allow_url_fopen=0 -d disable_functions=fsockopen,pfsockopen,stream_socket_client,curl_exec,curl_multi_exec,socket_create,exec,shell_exec,system,passthru,proc_open,popen tests/local/admin-cache-sync.php vendor/autoload.php
      - run: php -d allow_url_fopen=0 -d disable_functions=fsockopen,pfsockopen,stream_socket_client,curl_exec,curl_multi_exec,socket_create,exec,shell_exec,system,passthru,proc_open,popen tests/local/admin-file-sync.php vendor/autoload.php
      - run: php -d allow_url_fopen=0 -d disable_functions=fsockopen,pfsockopen,stream_socket_client,curl_exec,curl_multi_exec,socket_create,exec,shell_exec,system,passthru,proc_open,popen tests/local/access-file-sync.php vendor/autoload.php
      - run: php -d allow_url_fopen=0 -d disable_functions=fsockopen,pfsockopen,stream_socket_client,curl_exec,curl_multi_exec,socket_create,exec,shell_exec,system,passthru,proc_open,popen tests/local/admin-verification-refresh.php vendor/autoload.php
  windows-exe-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.native_smoke
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      COMPOSER_MEMORY_LIMIT: '512M'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: phar, zip, mbstring, openssl, curl
          coverage: none
          tools: composer:v2
      - run: composer install --no-plugins --no-scripts --prefer-dist --no-interaction --no-progress
      - run: composer phpacker
        id: package
        timeout-minutes: 8
      - run: php tests/windows/packaged-exe-smoke.php bin/build/bot/windows/windows-x64.exe bin/build/bot/windows/source.json
        timeout-minutes: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: civilizationbot-windows-${{ github.sha }}
          path: |
            bin/build/bot/windows/windows-x64.exe
            bin/build/bot/windows/source.json
          retention-days: 1
          if-no-files-found: error
  php8512-relay:
    name: Windows PHP 8.5.12 relay acceptance
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 41
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        timeout-minutes: 5
        with:
          php-version: '8.5'
          extensions: mbstring, openssl, curl
          coverage: none
        env:
          update: 'true'
          fail-fast: 'true'
      - name: Require exact configured Windows PHP 8.5.12
        timeout-minutes: 1
        shell: php {0}
        run: |
          <?php
          $curl = extension_loaded('curl') ? curl_version() : [];
          echo json_encode(['php'=>PHP_VERSION, 'os'=>PHP_OS_FAMILY, 'curl'=>extension_loaded('curl'), 'libcurl'=>$curl['version'] ?? null, 'ssl'=>$curl['ssl_version'] ?? null], JSON_THROW_ON_ERROR), PHP_EOL;
          if (PHP_OS_FAMILY !== 'Windows' || PHP_VERSION !== '8.5.12' || !extension_loaded('curl')) {
              fwrite(STDERR, "Expected configured Windows PHP 8.5.12 with curl\n");
              exit(1);
          }
      - name: Install locked offline-test dependencies
        timeout-minutes: 3
        run: composer install --no-interaction --no-plugins --no-scripts --no-dev
      - name: Seven diagnostic cases and unchanged strict relay test
        timeout-minutes: 2
        run: php tests/local/relay.php vendor/autoload.php
