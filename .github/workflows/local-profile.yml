name: Local profile offline contracts
on:
  pull_request:
    paths:
      - 'composer.json'
      - 'composer.lock'
      - 'src/Civ13/Local/**'
      - 'src/Civ13/Server/**'
      - 'src/Civ13/RestartPolicy.php'
      - 'src/Civ13/Civ13.php'
      - 'src/Civ13/GameServer.php'
      - 'src/Civ13/Slash.php'
      - 'src/Civ13/Panels.php'
      - 'src/Civ13/MessageCommand/Commands/AdminListUpdate.php'
      - 'src/Civ13/MessageCommand/Commands/Civ13GameServerMapSwap.php'
      - 'src/Civ13/HttpServiceManager.php'
      - 'local-bot.php'
      - 'tests/local/**'
      - 'scripts/local/**'
      - '.github/workflows/local-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replica:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3', '8.4']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none
      - run: php tests/local/run.php
      - run: php -l local-bot.php
  supervision:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php tests/local/library.php
      - run: php tests/local/opendream.php
      - run: php tests/local/restart-command.php vendor/autoload.php
      - run: php tests/local/lifecycle.php vendor/autoload.php
      - run: php tests/local/controls.php
      - run: php tests/local/server-compatibility.php vendor/autoload.php
        timeout-minutes: 2
      - run: php tests/local/relay.php vendor/autoload.php
        timeout-minutes: 2
      - run: php tests/local/message-delivery.php vendor/autoload.php
      - run: php tests/local/ooc-webhook.php vendor/autoload.php
      - run: php tests/local/unban-commands.php vendor/autoload.php
      - run: php tests/local/adminlist-consumers.php vendor/autoload.php
      - run: php tests/local/lifecycle-consumers.php vendor/autoload.php
