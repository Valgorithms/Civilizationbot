name: Offline Social lobby control
on:
  pull_request:
    paths:
      - 'src/Civ13/Social/**'
      - 'tests/social/**'
      - '.github/workflows/social-lobby.yml'
      - 'composer.json'
      - 'composer.lock'
permissions:
  contents: read
jobs:
  roster:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
      - run: composer check-platform-reqs
      - run: php -l src/Civ13/Social/LobbyRoster.php && php -l tests/social/roster.php
      - run: php tests/social/roster.php
