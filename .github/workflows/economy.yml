name: Offline economy contracts

on:
  push:
    paths:
      - 'src/Civ13/Economy/**'
      - 'tests/economy.php'
      - '.github/workflows/economy.yml'
  pull_request:
    paths:
      - 'src/Civ13/Economy/**'
      - 'tests/economy.php'
      - '.github/workflows/economy.yml'

permissions:
  contents: read

jobs:
  economy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - run: php tests/economy.php
