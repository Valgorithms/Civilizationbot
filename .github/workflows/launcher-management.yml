name: Launcher management contracts
on:
  pull_request:
    paths:
      - 'src/Civ13/Local/LauncherManagement.php'
      - 'src/Civ13/MessageCommand/Commands/Civ13GameServerManage.php'
      - 'src/Civ13/MessageServiceManager.php'
      - 'src/Civ13/GameServer.php'
      - 'tests/local/launcher-management.php'
      - '.github/workflows/launcher-management.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3', '8.4', '8.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, curl
          coverage: none
      - run: composer install --no-interaction --no-plugins --no-scripts --no-dev
      - run: php -l src/Civ13/Local/LauncherManagement.php
      - run: php -l src/Civ13/MessageCommand/Commands/Civ13GameServerManage.php
      - run: php -l src/Civ13/GameServer.php
      - run: php -l src/Civ13/MessageServiceManager.php
      - run: php tests/local/launcher-management.php
